<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout: Information · Larkspur Supply</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231C1B19'/%3E%3Cpath d='M16 27V6' stroke='%23F4F1EB' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='7' r='2.4' fill='%23F4F1EB'/%3E%3Ccircle cx='12.5' cy='12' r='2.4' fill='%23F4F1EB'/%3E%3Ccircle cx='19.5' cy='15' r='2.4' fill='%23F4F1EB'/%3E%3Ccircle cx='12.5' cy='18' r='2.4' fill='%23F4F1EB'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="checkout">

<header class="co-header">
  <div class="wrap">
    <a class="logo" href="index.html">
      <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 25V3" stroke="#1C1B19" stroke-width="1.5"/><circle cx="13" cy="4" r="2.2" fill="#1C1B19"/><circle cx="9.5" cy="8.5" r="2.2" fill="#1C1B19"/><circle cx="16.5" cy="11.5" r="2.2" fill="#1C1B19"/><circle cx="9.5" cy="14.5" r="2.2" fill="#1C1B19"/><circle cx="16.5" cy="17.5" r="2.2" fill="#1C1B19"/></svg>
      <span>Larkspur Supply</span>
    </a>
    <span class="secure"><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><rect x="1" y="7" width="12" height="8" rx="1.5" fill="none" stroke="#5E5951" stroke-width="1.4"/><path d="M4 7V5a3 3 0 016 0v2" fill="none" stroke="#5E5951" stroke-width="1.4"/></svg>Secure checkout</span>
  </div>
</header>

<details class="mobile-summary">
  <summary><span>Show order summary</span><strong data-summary-total>$0.00</strong></summary>
  <div class="inner" data-summary></div>
</details>

<div class="co">
  <main class="co-main">
    <div class="alert" id="checkoutAlert" role="alert" hidden>There was a problem with your order. Please review the highlighted fields.</div>
    <nav class="steps" aria-label="Checkout steps"><span>Bag</span><span>›</span><b>Information</b><span>›</span><span>Payment</span></nav>
    <h1>Shipping information</h1>

    <form id="shippingForm" novalidate>
      <h2>Contact</h2>
      <div class="fgrid">
        <div class="f full"><label for="email">Email <span class="req">*</span></label><input id="email" name="email" type="email" autocomplete="email"></div>
      </div>
      <label class="cb"><input type="checkbox" name="news" checked> Email me about new colors and restocks</label>

      <h2>Shipping address</h2>
      <div class="fgrid">
        <div class="f"><label for="firstName">First name <span class="req">*</span></label><input id="firstName" name="firstName" autocomplete="given-name"></div>
        <div class="f"><label for="lastName">Last name <span class="req">*</span></label><input id="lastName" name="lastName" autocomplete="family-name"></div>
        <div class="f full"><label for="address">Street address <span class="req">*</span></label><input id="address" name="address" autocomplete="address-line1"></div>
        <div class="f full"><label for="apt">Apartment, suite, etc. <span class="opt">(optional)</span></label><input id="apt" name="apt" autocomplete="address-line2"></div>
      </div>
      <div class="fgrid-3" style="margin-top:14px">
        <div class="f"><label for="city">City <span class="req">*</span></label><input id="city" name="city" autocomplete="address-level2"></div>
        <div class="f"><label for="state">State <span class="req">*</span></label>
          <select id="state" name="state" autocomplete="address-level1">
            <option value="">Select</option>
            <option>AL</option><option>AZ</option><option>CA</option><option>CO</option><option>CT</option><option>FL</option><option>GA</option>
            <option>IL</option><option>MA</option><option>MD</option><option>MI</option><option>MN</option><option>NC</option><option>NJ</option>
            <option>NY</option><option>OH</option><option>OR</option><option>PA</option><option>TX</option><option>VA</option><option>WA</option><option>WI</option>
          </select>
        </div>
        <div class="f"><label for="zip">ZIP code <span class="req">*</span></label><input id="zip" name="zip" inputmode="numeric" autocomplete="postal-code"></div>
      </div>
      <div class="fgrid" style="margin-top:14px">
        <div class="f"><label for="country">Country</label><select id="country" name="country" disabled><option>United States</option></select></div>
        <div class="f"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
      </div>

      <div class="co-actions">
        <a class="back" href="index.html">‹ Return to shop</a>
        <button type="submit" class="btn">Proceed</button>
      </div>
    </form>
  </main>

  <aside class="co-side" aria-label="Order summary">
    <div data-summary></div>
  </aside>
</div>

<script src="store.js"></script>
</body>
</html>
