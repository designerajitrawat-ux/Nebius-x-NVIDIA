<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in, Fernhill</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F6B4F'/%3E%3Cpath d='M16 6c-4.6 3.6-6.6 8.1-6.6 11.6 0 3.5 2.6 6 6.6 7.6 4-1.6 6.6-4.1 6.6-7.6C22.6 14.1 20.6 9.6 16 6z' fill='%23F2B84B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
<header class="site-header slim">
  <div class="container nav">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2F6B4F"/><path d="M16 25.5V7" stroke="#F2B84B" stroke-width="1.6" stroke-linecap="round"/><path d="M16 10.5c-2.4-1.3-4.7-.9-6.3.9 1.9 1.3 4.2 1.1 6.3-.2zM16 10.5c2.4-1.3 4.7-.9 6.3.9-1.9 1.3-4.2 1.1-6.3-.2zM16 15.5c-2.9-1.4-5.5-.9-7.3 1.2 2.2 1.4 4.9 1.2 7.3-.3zM16 15.5c2.9-1.4 5.5-.9 7.3 1.2-2.2 1.4-4.9 1.2-7.3-.3zM16 20.5c-2.3-1.1-4.4-.7-5.8 1 1.8 1.1 3.9.9 5.8-.2zM16 20.5c2.3-1.1 4.4-.7 5.8 1-1.8 1.1-3.9.9-5.8-.2z" fill="#F2B84B"/></svg>
      <span>Fernhill</span>
    </a>
    <div class="nav-actions"><span>New to Fernhill?</span> <a href="pricing.html">Get started</a></div>
  </div>
</header>
<main class="signup">
  <div class="container" style="max-width:520px">
    <section class="signup-card">
      <h1>Log in to Fernhill</h1>
      <p class="sub">Welcome back. Pick up where your team left off.</p>
      <form id="loginForm" novalidate>
        <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email"></div>
        <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
        <p id="loginError" class="field-error" hidden style="margin:-4px 0 14px"></p>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
        <p class="fine">New to Fernhill? <a href="pricing.html">Get started</a></p>
      </form>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
