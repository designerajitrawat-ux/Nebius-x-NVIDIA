# Deploys api/ to Modal whenever it changes on main.
# One-time setup (see docs/deploy.md): repo secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET, repo variable
# MODAL_DEPLOY = "true" and repo variable FIVEUSERS_ORIGINS (the web app's URL). Without MODAL_DEPLOY, this
# workflow does nothing, and you deploy from your laptop with `modal deploy modal_app.py` instead.
name: Deploy API to Modal

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.MODAL_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal==1.6.2
      - run: modal deploy modal_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          FIVEUSERS_ORIGINS: ${{ vars.FIVEUSERS_ORIGINS }}
